{% extends "base.html" %}
{% block title %}Checkout - Simple E-Shop{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto bg-white shadow rounded-lg p-8">
    <h1 class="text-2xl font-bold text-gray-900 mb-6">Checkout</h1>
    <form action="{{ url_for('checkout') }}" method="POST" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700">Full Name</label>
            <input type="text" name="name" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-indigo-500 focus:border-indigo-500">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700">Email Address</label>
            <input type="email" name="email" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-indigo-500 focus:border-indigo-500">
        </div>
        <button type="submit" class="w-full bg-indigo-600 text-white py-3 px-4 rounded-md font-semibold hover:bg-indigo-700 transition">
            Complete Order
        </button>
    </form>
</div>
{% endblock %}
