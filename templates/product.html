{% extends "base.html" %}
{% block title %}{{ product.name }} - E-Shop{% endblock %}
{% block content %}
<div class="row g-5">
    <div class="col-md-6">
        {% if product.image_url %}
        <img src="{{ product.image_url }}" class="img-fluid rounded shadow-sm" alt="{{ product.name }}">
        {% endif %}
    </div>
    <div class="col-md-6">
        <h1 class="display-5 fw-bold">{{ product.name }}</h1>
        <p class="h3 text-primary mb-4">${{ "%.2f"|format(product.price) }}</p>
        <p class="lead">{{ product.description }}</p>
        <hr class="my-4">
        <form action="{{ url_for('add_to_cart', product_id=product.id) }}" method="POST">
            <button type="submit" class="btn btn-primary btn-lg">Add to Cart</button>
            <a href="{{ url_for('index') }}" class="btn btn-outline-secondary btn-lg ms-2">Back to Shop</a>
        </form>
    </div>
</div>
{% endblock %}
