{% extends "base.html" %}
{% block title %}Products - Simple E-Shop{% endblock %}
{% block content %}
<div class="mb-8">
    <h1 class="text-3xl font-extrabold text-gray-900">Featured Products</h1>
    <p class="mt-2 text-sm text-gray-600">Check out our latest tech gear.</p>
</div>

<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
    {% for product in products %}
    <div class="bg-white rounded-lg shadow overflow-hidden flex flex-col">
        <img src="{{ product.image_url }}" alt="{{ product.name }}" class="h-48 w-full object-cover">
        <div class="p-4 flex-grow flex flex-col justify-between">
            <div>
                <h3 class="text-lg font-semibold text-gray-900">{{ product.name }}</h3>
                <p class="mt-1 text-sm text-gray-600 line-clamp-2">{{ product.description }}</p>
            </div>
            <div class="mt-4 flex items-center justify-between">
                <span class="text-xl font-bold text-indigo-600">${{ "%.2f"|format(product.price) }}</span>
                <form action="{{ url_for('add_to_cart', product_id=product.id) }}" method="POST">
                    <button type="submit" class="bg-indigo-600 text-white px-3 py-1.5 rounded text-sm font-medium hover:bg-indigo-700 transition">
                        Add to Cart
                    </button>
                </form>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
